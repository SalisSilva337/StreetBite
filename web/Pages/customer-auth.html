<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Styles/landingPage.css" />
    <script src="../Scripts/landingPage.js" type="module"></script>
    <title>StreetBite - Cadastro do cliente</title>
    <link
      rel="shortcut icon"
      href="../Imgs/images/favcon.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <main class="auth-shell">
      <article class="auth-card" data-customer-auth-root>
        <div class="auth-header">
          <p class="auth-kicker">Cadastro do cliente</p>
          <h1 class="auth-title">Cadastre o cliente para a comanda</h1>
          <p class="auth-description">
            O cadastro do consumidor grava o nome que será reutilizado na
            criação da comanda e no acompanhamento dos pedidos.
          </p>
        </div>

        <div
          class="auth-status"
          data-auth-status
          role="status"
          aria-live="polite"
        ></div>

        <form class="auth-form" data-auth-view="register" novalidate>
          <fieldset class="auth-fieldset">
            <legend class="auth-legend">Dados pessoais</legend>

            <label class="auth-field">
              <span class="field-label"
                >Nome do cliente
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <span
                class="field-status"
                data-field-status="name"
                aria-hidden="true"
              ></span>
              <input
                class="field-input"
                type="text"
                autocomplete="name"
                placeholder="Nome do cliente"
                required
                aria-required="true"
                data-register-name
              />
            </label>

            <label class="auth-field">
              <span class="field-label"
                >E-mail
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <span
                class="field-status"
                data-field-status="email"
                aria-hidden="true"
              ></span>
              <input
                class="field-input"
                type="email"
                autocomplete="email"
                placeholder="cliente@exemplo.com"
                required
                aria-required="true"
                aria-describedby="customer-email-help"
                data-register-email
              />
              <span id="customer-email-help" class="field-help"
                >E-mail do cliente para identificação na comanda.</span
              >
            </label>

            <label class="auth-field">
              <span class="field-label"
                >Telefone
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <span
                class="field-status"
                data-field-status="phone"
                aria-hidden="true"
              ></span>
              <input
                class="field-input"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                placeholder="(99) 9 9999-9999"
                required
                aria-required="true"
                data-register-phone
              />
            </label>
          </fieldset>

          <fieldset class="auth-fieldset">
            <legend class="auth-legend">Endereço</legend>

            <div class="auth-grid auth-grid--address">
              <label class="auth-field">
                <span class="field-label"
                  >CEP
                  <span class="field-required" aria-hidden="true">*</span></span
                >
                <span
                  class="field-status"
                  data-field-status="cep"
                  aria-hidden="true"
                ></span>
                <input
                  class="field-input"
                  type="text"
                  inputmode="numeric"
                  autocomplete="postal-code"
                  placeholder="00000-000"
                  required
                  aria-required="true"
                  data-register-cep
                />
              </label>

              <label class="auth-field">
                <span class="field-label"
                  >Número
                  <span class="field-required" aria-hidden="true">*</span></span
                >
                <span
                  class="field-status"
                  data-field-status="number"
                  aria-hidden="true"
                ></span>
                <input
                  class="field-input"
                  type="text"
                  inputmode="numeric"
                  autocomplete="off"
                  placeholder="123"
                  required
                  aria-required="true"
                  data-register-number
                />
              </label>
            </div>

            <label class="auth-field">
              <span class="field-label"
                >Rua
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <span
                class="field-status"
                data-field-status="street"
                aria-hidden="true"
              ></span>
              <input
                class="field-input"
                type="text"
                autocomplete="address-line1"
                placeholder="Rua, avenida ou travessa"
                required
                aria-required="true"
                data-register-street
              />
            </label>
          </fieldset>

          <div class="auth-actions auth-actions--split">
            <button class="auth-link" type="button" data-customer-back>
              Voltar
            </button>
            <button class="auth-button" type="submit">Cadastrar cliente</button>
          </div>
        </form>
      </article>
    </main>

    <button
      class="themeToggleLanding"
      id="themeToggleLandingButton"
      type="button"
      aria-label="Ativar modo escuro"
      aria-pressed="false"
      title="Alternar tema"
    >
      <span
        id="themeToggleLandingIcon"
        class="themeToggleLandingGlyph"
        aria-hidden="true"
        >☾</span
      >
    </button>

    <script type="module">
      import { initializeCustomerAuth } from "../Scripts/customerAuth.js";

      document.addEventListener("DOMContentLoaded", () => {
        initializeCustomerAuth();
      });
    </script>
  </body>
</html>
