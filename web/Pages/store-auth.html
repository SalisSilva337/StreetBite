<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Styles/landingPage.css" />
    <script src="../Scripts/landingPage.js" type="module"></script>
    <title>StreetBite - Login e cadastro do foodtruck</title>
    <link
      rel="shortcut icon"
      href="../Imgs/images/favcon.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <main class="auth-shell">
      <article class="auth-card" data-store-auth-root>
        <div class="auth-header">
          <a class="auth-back-link" href="../index.html">← Voltar</a>
          <p class="auth-kicker">Acesso da loja</p>
          <h1 id="storeAuthTitle" class="auth-title">
            Entre ou cadastre seu foodtruck
          </h1>
          <p class="auth-description">
            Cadastre o foodtruck com nome, e-mail, documento, contato e forma de
            pagamento.
          </p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Cadastro e login">
          <button
            class="auth-tab is-active"
            type="button"
            data-auth-tab="login"
            aria-selected="true"
          >
            Login
          </button>
          <button
            class="auth-tab"
            type="button"
            data-auth-tab="register"
            aria-selected="false"
          >
            Cadastro
          </button>
        </div>

        <div
          class="auth-status"
          data-auth-status
          role="status"
          aria-live="polite"
        ></div>

        <form class="auth-form" data-auth-view="login" novalidate>
          <fieldset class="auth-fieldset">
            <legend class="auth-legend">Credenciais de acesso</legend>

            <label class="auth-field">
              <span class="field-label"
                >E-mail
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <input
                class="field-input"
                type="email"
                autocomplete="username"
                placeholder="Digite o e-mail cadastrado"
                required
                aria-required="true"
                aria-describedby="login-identity-help"
                data-login-identity
              />
              <span id="login-identity-help" class="field-help"
                >Informe o e-mail cadastrado no seu foodtruck.</span
              >
            </label>

            <label class="auth-field">
              <span class="field-label"
                >Senha
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <input
                class="field-input"
                type="password"
                autocomplete="current-password"
                placeholder="Digite sua senha"
                required
                aria-required="true"
                data-login-password
              />
            </label>
          </fieldset>

          <div class="auth-actions auth-actions--split">
            <a class="auth-link" href="store-reset.html">Esqueci a senha</a>
            <button class="auth-button" type="submit">Entrar</button>
          </div>
        </form>

        <form
          class="auth-form hidden"
          data-auth-view="register"
          novalidate
          autocomplete="off"
        >
          <fieldset class="auth-fieldset">
            <legend class="auth-legend">Dados do foodtruck</legend>

            <label class="auth-field">
              <span class="field-label"
                >Nome do foodtruck
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <input
                class="field-input"
                type="text"
                autocomplete="off"
                placeholder="Nome da loja"
                required
                aria-required="true"
                aria-describedby="register-shop-name-help"
                data-register-shop-name
              />
              <span id="register-shop-name-help" class="field-help"
                >Nome público do seu foodtruck exibido no painel.</span
              >
            </label>

            <label class="auth-field">
              <span class="field-label"
                >E-mail
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <input
                class="field-input"
                type="email"
                autocomplete="off"
                placeholder="contato@foodtruck.com"
                required
                aria-required="true"
                aria-describedby="register-email-help"
                data-register-email
              />
              <span id="register-email-help" class="field-help"
                >E-mail que será usado para acessar o painel.</span
              >
            </label>

            <label class="auth-field">
              <span class="field-label"
                >Senha
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <input
                class="field-input"
                type="password"
                autocomplete="off"
                placeholder="Crie uma senha"
                required
                aria-required="true"
                aria-describedby="register-password-help"
                data-register-password
              />
              <span id="register-password-help" class="field-help"
                >Mínimo de 8 caracteres, com letras e números.</span
              >
            </label>

            <label class="auth-field">
              <span class="field-label"
                >CPF ou CNPJ
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <input
                class="field-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="00.000.000/0000-00"
                required
                aria-required="true"
                aria-describedby="register-document-help"
                data-register-document
              />
              <span id="register-document-help" class="field-help"
                >CPF (11 dígitos) ou CNPJ (14 dígitos) do estabelecimento.</span
              >
            </label>
          </fieldset>

          <fieldset class="auth-fieldset">
            <legend class="auth-legend">Endereço e contato</legend>

            <div class="auth-grid">
              <label class="auth-field">
                <span class="field-label"
                  >CEP da loja
                  <span class="field-required" aria-hidden="true">*</span></span
                >
                <input
                  class="field-input"
                  type="text"
                  inputmode="numeric"
                  autocomplete="off"
                  placeholder="00000000"
                  required
                  aria-required="true"
                  data-register-cep
                />
              </label>

              <label class="auth-field">
                <span class="field-label"
                  >Número de contato
                  <span class="field-required" aria-hidden="true">*</span></span
                >
                <input
                  class="field-input"
                  type="tel"
                  autocomplete="username"
                  placeholder="(00) 00000-0000"
                  required
                  aria-required="true"
                  data-register-contact
                />
              </label>
            </div>

            <label class="auth-field">
              <span class="field-label"
                >Forma de pagamento do plano
                <span class="field-required" aria-hidden="true">*</span></span
              >
              <select
                class="field-input"
                required
                aria-required="true"
                data-register-payment
              >
                <option value="" disabled selected>
                  Selecione a forma de pagamento
                </option>
              </select>
              <span class="field-help"
                >Método de cobrança da assinatura do plano.</span
              >
            </label>
          </fieldset>

          <div class="auth-actions">
            <button class="auth-button" type="submit">
              Cadastrar foodtruck
            </button>
          </div>
        </form>
      </article>
    </main>

    <button
      class="themeToggleLanding"
      id="themeToggleLandingButton"
      type="button"
      aria-label="Ativar modo escuro"
      aria-pressed="false"
      title="Alternar tema"
    >
      <span
        id="themeToggleLandingIcon"
        class="themeToggleLandingGlyph"
        aria-hidden="true"
        >☾</span
      >
    </button>

    <script type="module">
      import { initializeLandingAuth } from "../Scripts/storeAuth.js";

      document.addEventListener("DOMContentLoaded", () => {
        initializeLandingAuth();
      });
    </script>
  </body>
</html>
