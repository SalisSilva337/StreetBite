<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Styles/landingPage.css" />
    <title>StreetBite - Login e cadastro do foodtruck</title>
    <link
      rel="shortcut icon"
      href="../Imgs/images/favcon.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <main class="auth-shell">
      <article class="auth-card" data-store-auth-root>
        <div class="auth-header">
          <p class="auth-kicker">Acesso da loja</p>
          <h1 id="storeAuthTitle" class="auth-title">
            Entre ou cadastre seu foodtruck
          </h1>
          <p class="auth-description">
            Cadastre o foodtruck com nome, e-mail, documento, contato e forma de
            pagamento.
          </p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Cadastro e login">
          <button
            class="auth-tab is-active"
            type="button"
            data-auth-tab="login"
            aria-selected="true"
          >
            Login
          </button>
          <button
            class="auth-tab"
            type="button"
            data-auth-tab="register"
            aria-selected="false"
          >
            Cadastro
          </button>
        </div>

        <div
          class="auth-status"
          data-auth-status
          role="status"
          aria-live="polite"
        ></div>

        <form class="auth-form" data-auth-view="login" novalidate>
          <label class="auth-field">
            <span class="field-label">Nome da loja ou contato</span>
            <input
              class="field-input"
              type="text"
              autocomplete="username"
              placeholder="Digite o nome da loja ou telefone"
              data-login-identity
            />
          </label>

          <label class="auth-field">
            <span class="field-label">Senha</span>
            <input
              class="field-input"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              data-login-password
            />
          </label>

          <div class="auth-actions auth-actions--split">
            <a class="auth-link" href="store-reset.html">Esqueci a senha</a>
            <button class="auth-button" type="submit">Entrar</button>
          </div>
        </form>

        <form
          class="auth-form hidden"
          data-auth-view="register"
          novalidate
          autocomplete="off"
        >
          <label class="auth-field">
            <span class="field-label">Nome do foodtruck</span>
            <input
              class="field-input"
              type="text"
              autocomplete="off"
              placeholder="Nome da loja"
              data-register-shop-name
            />
          </label>

          <label class="auth-field">
            <span class="field-label">E-mail</span>
            <input
              class="field-input"
              type="email"
              autocomplete="off"
              placeholder="contato@foodtruck.com"
              data-register-email
            />
          </label>

          <label class="auth-field">
            <span class="field-label">Senha</span>
            <input
              class="field-input"
              type="password"
              autocomplete="off"
              placeholder="Crie uma senha"
              data-register-password
            />
          </label>

          <label class="auth-field">
            <span class="field-label">CPF ou CNPJ</span>
            <input
              class="field-input"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="00.000.000/0000-00"
              data-register-document
            />
          </label>

          <div class="auth-grid">
            <label class="auth-field">
              <span class="field-label">CEP da loja</span>
              <input
                class="field-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="00000000"
                data-register-cep
              />
            </label>

            <label class="auth-field">
              <span class="field-label">Número de contato</span>
              <input
                class="field-input"
                type="tel"
                autocomplete="username"
                placeholder="Digite o nome da loja ou telefone"
                placeholder="(00) 00000-0000"
                data-register-contact
              />
            </label>
          </div>

          <label class="auth-field">
            <span class="field-label">Forma de pagamento do plano</span>
            <input
              class="field-input"
              type="text"
              autocomplete="off"
              placeholder="Cartão, Pix, boleto..."
              placeholder="(99) 9 9999-9999"
            />
          </label>

          <div class="auth-actions">
            <button class="auth-button" type="submit">
              Cadastrar foodtruck
            </button>
          </div>
        </form>
      </article>
    </main>

    <script type="module">
      import { initializeLandingAuth } from "../Scripts/storeAuth.js";

      document.addEventListener("DOMContentLoaded", () => {
        initializeLandingAuth();
      });
    </script>
  </body>
</html>
