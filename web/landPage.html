<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./Scripts/landPage.js" type="module"></script>
    <link rel="stylesheet" href="Styles/landPage.css" />
    <title>StreetBite</title>
    <link
      rel="shortcut icon"
      href="Imgs/images/favcon.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <main class="page-center">
      <section class="info-section">
        <div class="logo-all">
          <div class="logo-circle">
            <img
              src="Imgs/images/StreetBite-logo.png"
              alt="Logo StreetBite"
              class="burger-icon"
            />
          </div>
        </div>

        <section class="dialog-box">
          <div class="box-names">
            <h1 class="main-name">VENDA MAIS, ANOTE MENOS</h1>
            <div>
              <p class="secondary-name">
                Otimize as suas relações com os clientes utilizando o nosso novo
                APP de gerenciamento de vendas e estoque.
              </p>
              <p>
                O StreetBite otimiza processos, reduz erros e contribui para a
                organização e sucesso dos foodtrucks.
              </p>
            </div>
          </div>

          <div>
            <a
              class="button-seeMore"
              href="Pages/streetBite.html"
              aria-label="Abrir painel StreetBite"
            >
              SAIBA MAIS...
            </a>
          </div>
        </section>
      </section>

      <section class="img-section">
        <img
          src="Imgs/images/burger.jpg"
          alt="Hamburguer artesanal StreetBite"
        />
      </section>
    </main>
  </body>
</html>
