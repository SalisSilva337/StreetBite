<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Styles/landPage.css" />
    <title>StreetBite - Login e cadastro da loja</title>
    <link
      rel="shortcut icon"
      href="Imgs/images/favcon.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <main class="auth-shell">
      <article class="auth-card" data-store-auth-root>
        <div class="auth-header">
          <p class="auth-kicker">Acesso da loja</p>
          <h1 id="storeAuthTitle" class="auth-title">
            Entre ou cadastre sua loja
          </h1>
          <p class="auth-description">
            Cadastre nome da loja, senha, CEP e contato. O CEP cadastrado será
            usado automaticamente no pedido quando o atendimento for retirada na
            loja.
          </p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Cadastro e login">
          <button
            class="auth-tab is-active"
            type="button"
            data-auth-tab="login"
            aria-selected="true"
          >
            Login
          </button>
          <button
            class="auth-tab"
            type="button"
            data-auth-tab="register"
            aria-selected="false"
          >
            Cadastro
          </button>
        </div>

        <div
          class="auth-status"
          data-auth-status
          role="status"
          aria-live="polite"
        ></div>

        <form class="auth-form" data-auth-view="login" novalidate>
          <label class="auth-field">
            <span class="field-label">Nome da loja ou contato</span>
            <input
              class="field-input"
              type="text"
              autocomplete="username"
              placeholder="Digite o nome da loja ou telefone"
              data-login-identity
            />
          </label>

          <label class="auth-field">
            <span class="field-label">Senha</span>
            <input
              class="field-input"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              data-login-password
            />
          </label>

          <div class="auth-actions auth-actions--split">
            <a class="auth-link" href="store-reset.html">Esqueci a senha</a>
            <button class="auth-button" type="submit">Entrar</button>
          </div>
        </form>

        <form class="auth-form hidden" data-auth-view="register" novalidate>
          <label class="auth-field">
            <span class="field-label">Nome da loja</span>
            <input
              class="field-input"
              type="text"
              autocomplete="organization"
              placeholder="Nome da loja"
              data-register-shop-name
            />
          </label>

          <label class="auth-field">
            <span class="field-label">Senha</span>
            <input
              class="field-input"
              type="password"
              autocomplete="new-password"
              placeholder="Crie uma senha"
              data-register-password
            />
          </label>

          <div class="auth-grid">
            <label class="auth-field">
              <span class="field-label">CEP da loja</span>
              <input
                class="field-input"
                type="text"
                inputmode="numeric"
                autocomplete="postal-code"
                placeholder="00000000"
                data-register-cep
              />
            </label>

            <label class="auth-field">
              <span class="field-label">Número de contato</span>
              <input
                class="field-input"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                placeholder="(00) 00000-0000"
                data-register-contact
              />
            </label>
          </div>

          <div class="auth-actions">
            <button class="auth-button" type="submit">Cadastrar loja</button>
          </div>
        </form>

        <p class="auth-note">
          Ao escolher retirada na loja, o CEP configurado no cadastro será
          preenchido automaticamente.
        </p>
      </article>
    </main>

    <script type="module">
      import { initializeLandingAuth } from "./Scripts/storeAuth.js";

      document.addEventListener("DOMContentLoaded", () => {
        initializeLandingAuth();
      });
    </script>
  </body>
</html>
